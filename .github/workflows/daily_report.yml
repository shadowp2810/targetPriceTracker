name: Daily Targets Report

on:
  schedule:
    # 9:30 PM UTC = 4:30 PM ET (EST/winter) or 5:30 PM ET (EDT/summer)
    # Always 30+ min after NYSE close (4:00 PM ET)
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # allow manual trigger anytime from the GitHub Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # need HEAD~1 if same-day re-run guard is added later

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install --upgrade -r requirements.txt

      - name: Generate targets report
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
        run: python main.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/CNAME reports/latest_targets.json
          git diff --staged --quiet && echo "No changes to commit" || \
            git commit -m "chore: update targets report $(date +'%Y-%m-%d')" && git push
